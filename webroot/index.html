<!doctype html>
<html lang="zh-Hant" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>開機動畫 for ColorOS</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="styles.css">
    <style>
      /* Layout glue only; colours, type ramp, cards, list, chips, slider and
         sheet all come from styles.css so this page matches the other modules. */
      html, body { margin: 0; min-height: 100%; }
      body { background: var(--md-sys-color-background); color: var(--md-sys-color-on-background); }
      /* .app-surface is 100vh with overflow:hidden, so scrolling must happen in
         an inner container or the page simply cannot be dragged. */
      .ba-bar { display: flex; align-items: center; gap: var(--sp-3); flex: 0 0 auto;
        padding: var(--sp-5) var(--app-gutter) var(--sp-3);
        background: var(--md-sys-color-background); }
      .ba-bar h1 { margin: 0; flex: 1; font-size: 22px; line-height: 28px; font-weight: 500; }
      .ba-bar .sub { display: block; font-size: 12px; font-weight: 400;
        color: var(--md-sys-color-on-surface-variant); }
      .ba-main {
        flex: 1 1 auto; min-height: 0;
        overflow-y: auto; overflow-x: hidden;
        -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
        padding: 0 var(--app-gutter) 120px;
        display: flex; flex-direction: column; gap: var(--sp-4);
      }
      .ba-preview { display: flex; gap: var(--sp-4); align-items: center; }
      .ba-preview img { width: 72px; height: 158px; object-fit: cover; border-radius: var(--md-sys-shape-m);
        background: var(--md-sys-color-surface-container-highest); flex-shrink: 0; }
      .ba-kv { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .ba-kv .v { font-size: 14px; }
      .ba-kv .k { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
      .ba-row { display: flex; flex-direction: column; gap: var(--sp-1); padding: var(--sp-2) 0; }
      .ba-row-head { display: flex; align-items: baseline; gap: var(--sp-2); }
      .ba-row-head .name { flex: 1; font-size: 14px; }
      .ba-row-head .val { font-size: 14px; color: var(--md-sys-color-primary); font-variant-numeric: tabular-nums; }
      .ba-actions { display: flex; gap: var(--sp-3); padding-top: var(--sp-2); }
      .ba-btn { flex: 1; border: 0; cursor: pointer; font: inherit; font-size: 15px; font-weight: 500;
        padding: var(--sp-4); border-radius: var(--md-sys-shape-full);
        background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
      .ba-btn[data-kind="tonal"] { background: var(--md-sys-color-secondary-container);
        color: var(--md-sys-color-on-secondary-container); }
      .ba-btn:disabled { opacity: .4; cursor: default; }
      .ba-file { display: flex; flex-direction: column; gap: var(--sp-2); }
      .ba-file input[type="file"] { display: none; }
      .ba-pick { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
        padding: var(--sp-3) var(--sp-5); border-radius: var(--md-sys-shape-full);
        background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container);
        font-size: 14px; font-weight: 500; cursor: pointer; }
      .ba-note { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
      .ba-input { width: 100%; box-sizing: border-box; padding: var(--sp-3) var(--sp-4);
        border-radius: var(--md-sys-shape-s); border: 1px solid var(--md-sys-color-outline-variant);
        background: var(--md-sys-color-surface-container-low); color: inherit; font: inherit; font-size: 14px; }
      .ba-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(12px);
        background: var(--md-sys-color-inverse-surface); color: var(--md-sys-color-inverse-on-surface);
        padding: var(--sp-3) var(--sp-5); border-radius: var(--md-sys-shape-s);
        font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 40;
        max-width: 82vw; text-align: center; }
      .ba-toast[data-show="true"] { opacity: 1; transform: translateX(-50%) translateY(0); }
      .ba-progress { height: 4px; border-radius: var(--md-sys-shape-full); overflow: hidden;
        background: var(--md-sys-color-secondary-container); }
      .ba-progress span { display: block; height: 100%; width: 0;
        background: var(--md-sys-color-primary); transition: width .3s; }
    </style>
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="app-surface">
      <div class="ba-bar">
        <h1>開機動畫 for ColorOS<span class="sub" data-sub>正在讀取模組狀態…</span></h1>
      </div>
      <div class="ba-main" data-main></div>
      <div class="ba-toast" data-toast></div>
    </div>
  </body>
</html>
